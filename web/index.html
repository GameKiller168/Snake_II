<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake II</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="description" content="Snake II, the game of the Nokia 3310, in the browser: the same display, the same menus, the same rules.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='2'%20fill='%23a2ad8a'/%3E%3Cpath%20fill='%23222a1c'%20d='M2%2010h2v2H2zM4%2010h2v2H4zM6%2010h2v2H6zM8%2010h2v2H8zM8%208h2v2H8zM8%206h2v2H8zM10%206h2v2h-2zM12%206h2v2h-2z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/notice.css">
</head>
<body>
<main class="unit">
  <h1 class="title">Snake II</h1>

  <div class="screen">
  <canvas id="lcd" role="img" aria-label="Display of the game"></canvas>
  </div>

  <div class="keys" id="keys" role="group" aria-label="Keys">
    <div class="functions">
      <button type="button" tabindex="-1" data-key="c" aria-label="C"><span class="cap">C</span></button>
      <button type="button" tabindex="-1" data-key="scrollUp" aria-label="Scroll up"><span class="cap">&#9650;</span></button>
      <button type="button" tabindex="-1" data-key="scrollDown" aria-label="Scroll down"><span class="cap">&#9660;</span></button>
      <button type="button" tabindex="-1" data-key="select" class="wide" aria-label="Select"><span class="cap">Select</span></button>
    </div>
    <div class="digits">
      <button type="button" tabindex="-1" data-key="1"><span class="cap">1</span></button>
      <button type="button" tabindex="-1" data-key="2" aria-label="2, up"><span class="cap">2</span><span class="hint">&#9650;</span></button>
      <button type="button" tabindex="-1" data-key="3"><span class="cap">3</span></button>
      <button type="button" tabindex="-1" data-key="4" aria-label="4, left"><span class="cap">4</span><span class="hint">&#9664;</span></button>
      <button type="button" tabindex="-1" data-key="5"><span class="cap">5</span></button>
      <button type="button" tabindex="-1" data-key="6" aria-label="6, right"><span class="cap">6</span><span class="hint">&#9654;</span></button>
      <button type="button" tabindex="-1" data-key="7"><span class="cap">7</span></button>
      <button type="button" tabindex="-1" data-key="8" aria-label="8, down"><span class="cap">8</span><span class="hint">&#9660;</span></button>
      <button type="button" tabindex="-1" data-key="9"><span class="cap">9</span></button>
    </div>
  </div>

  <p class="help">Keyboard: arrow keys or 2 4 6 8 steer the snake, Enter = Select, Backspace = C, up / down arrows scroll the menu.</p>
</main>

<noscript><p class="noscript">Snake II needs JavaScript.</p></noscript>

<script src="js/config.js"></script>
<script src="js/framebuffer.js"></script>
<script src="js/rng.js"></script>
<script src="js/font.js"></script>
<script src="js/tiles.js"></script>
<script src="js/pictures.js"></script>
<script src="js/texts.js"></script>
<script src="js/i18n.js"></script>
<script src="js/text.js"></script>
<script src="js/engine.js"></script>
<script src="js/scene.js"></script>
<script src="js/screens.js"></script>
<script src="js/store.js"></script>
<script src="js/phone.js"></script>
<script src="js/save.js"></script>
<script src="js/tones.js"></script>
<script src="js/audio.js"></script>
<script src="js/notice.js"></script>
<script src="js/lcd.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
