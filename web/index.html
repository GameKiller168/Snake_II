<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Snake II</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a07">
<meta name="description" content="Snake II in the browser - the classic phone game, no installation, no dependencies.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3'%20fill='%2339ff14'/%3E%3Cpath%20fill='%23051005'%20d='M2%2010h2v2H2zM4%2010h2v2H4zM6%2010h2v2H6zM8%2010h2v2H8zM8%208h2v2H8zM8%206h2v2H8zM10%206h2v2h-2zM12%206h2v2h-2z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app" data-input="kbd" data-mode="title">
  <header class="bar">
    <h1 class="logo">SNAKE&nbsp;II</h1>
    <div class="tools" id="tools" role="group">
      <button type="button" class="chip" id="btn-sound" aria-pressed="true"></button>
      <button type="button" class="chip" id="btn-skin"></button>
      <button type="button" class="chip" id="btn-lang"></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="bezel" id="bezel">
      <canvas id="lcd" width="840" height="576" role="img"></canvas>
    </div>
  </main>

  <p class="hint" id="hint"></p>

  <section class="pad" id="pad">
    <div class="dpad">
      <button type="button" class="key k-up" data-action="up" id="k-up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l9 13H3z"/></svg></button>
      <button type="button" class="key k-left" data-action="left" id="k-left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l13-9v18z"/></svg></button>
      <button type="button" class="key k-right" data-action="right" id="k-right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12L6 3v18z"/></svg></button>
      <button type="button" class="key k-down" data-action="down" id="k-down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19L3 6h18z"/></svg></button>
    </div>
    <div class="side">
      <button type="button" class="key wide ok" data-action="space" id="btn-ok"></button>
      <button type="button" class="key wide ghost" data-action="quit" id="btn-menu"></button>
    </div>
  </section>
</div>

<div class="sr-only" id="live" role="status" aria-live="polite"></div>
<noscript><p class="noscript">Snake II needs JavaScript. / A Snake II-h&ouml;z JavaScript kell.</p></noscript>

<script src="js/config.js"></script>
<script src="js/framebuffer.js"></script>
<script src="js/font.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/scene.js"></script>
<script src="js/store.js"></script>
<script src="js/controller.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/lcd.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
